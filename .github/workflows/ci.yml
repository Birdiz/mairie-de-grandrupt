name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valeurs factices pour que src/lib/env.ts et payload.config.ts se chargent
# (mêmes valeurs que le Dockerfile). Aucun e-mail n'est envoyé en CI.
env:
  NEXT_TELEMETRY_DISABLED: 1
  RESEND_API_KEY: ci-placeholder
  CONTACT_EMAIL_TO: ci@example.com
  CONTACT_EMAIL_FROM: ci@example.com
  PAYLOAD_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
  DATABASE_URI: file:./data/payload.db

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run type-check

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build

  e2e:
    name: E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts lance .next/standalone/server.js quand CI est défini :
      # on teste l'app de production, migrations Payload comprises (base neuve).
      - name: Build Next.js (standalone)
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      # SQLite ne crée pas le dossier de la base, et server.js fait un chdir dans
      # .next/standalone : file:./data/… y pointe (comme /app/data en Docker).
      - name: Tests E2E (Playwright)
        run: |
          mkdir -p .next/standalone/data
          npx playwright test --project=chromium

      - name: Rapport Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Vérifie seulement que l'image de prod se construit : rien n'est publié.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
